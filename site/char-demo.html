<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #eef1f6; color: #1b2238; font: 15px/1.4 system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #ui { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px 14px;
            align-items: center; padding: 12px 14px; background: #fffffff0; border-radius: 10px;
            box-shadow: 0 2px 12px #0002; }
      #ui input[type=range] { flex: 1 1 200px; min-width: 0; }
      #ui output { font-variant-numeric: tabular-nums; min-width: 9ch; }
      #ui button, #ui select { font: inherit; }
    </style>
  </head>
  <body>
    <div id="ui">
      <select id="mode" aria-label="Mode">
        <option value="hero">Hero (h)</option>
        <option value="hang">Pose: hang</option>
        <option value="fall">Pose: fall</option>
        <option value="land">Pose: land</option>
        <option value="stand">Pose: stand</option>
      </select>
      <input id="t" type="range" min="0" max="1.2" step="0.001" value="0" aria-label="Scroll h or pose t" />
      <output id="out">h 0.000</output>
      <button id="play" type="button">Play</button>
      <label><input id="calm" type="checkbox" /> reduced motion</label>
    </div>
    <script type="module" src="/src/three/char-demo.ts"></script>
  </body>
</html>
