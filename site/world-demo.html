<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First world demo</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #ffffff; color: #1b2238; font: 16px/1.4 system-ui, sans-serif; }
      main { max-width: 1100px; margin: 0 auto; padding: 16px; }
      #stage svg { width: 100%; max-height: calc(100svh - 72px); }
      .controls {
        position: sticky; bottom: 0; display: flex; align-items: center; gap: 12px;
        padding: 12px 0; background: #ffffff;
      }
      .controls input { flex: 1; min-width: 0; }
      .controls output { width: 3em; text-align: right; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <main>
      <div id="stage"></div>
      <div class="controls">
        <label for="progress">Progress</label>
        <input id="progress" type="range" min="0" max="1" step="0.001" value="0" />
        <output id="value" for="progress">0.00</output>
      </div>
    </main>
    <script type="module" src="/src/worlds/demo.ts"></script>
  </body>
</html>
