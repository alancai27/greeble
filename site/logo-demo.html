<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logo candidates</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #ffffff; color: #1b2238; font: 16px/1.4 system-ui, sans-serif; }
      main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 64px; }
      h1 { font-size: 24px; margin: 0 0 4px; }
      h2 { font-size: 18px; margin: 32px 0 8px; }
      p { margin: 0 0 8px; color: #4a5270; }
      .row { display: flex; flex-wrap: wrap; gap: 12px; }
      .panel { flex: 1 1 280px; display: flex; align-items: center; gap: 24px; padding: 24px; border-radius: 10px; border: 1px solid #dfe3ec; }
      .light { background: #ffffff; --ink: #1b2238; }
      .dark { background: #15112e; --ink: #ffffff; border-color: #15112e; }
      .panel svg { display: block; flex: none; }
      .ink { fill: var(--ink); }
    </style>
  </head>
  <body>
    <main>
      <h1>Greeble logo candidates</h1>
      <p>The current mark, then three redraws. Each at 16, 32 and 128 px, on white and on dark. Candidate 1 ships as the favicon and header mark.</p>
      <div id="list"></div>
    </main>
    <script>
      const shapes = {
        old: '<rect class="ink" x="3" y="13" width="26" height="16" rx="3"/><path d="M7 13a6 6 0 0 1 12 0z" fill="#f2a900"/>',
        c1: '<rect class="ink" x="4" y="12" width="24" height="14" rx="2"/><path d="M10 12V7a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v5z" fill="#f2a900"/>',
        c2: '<rect class="ink" x="4" y="12" width="24" height="12" rx="2"/><path d="M6 12V9a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v3zm12 0V9a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v3z" fill="#f2a900"/>',
        c3: '<rect class="ink" x="6" y="14" width="20" height="12" rx="2"/><rect x="12" y="6" width="8" height="6" rx="1" fill="#f2a900"/>',
      };
      const names = {
        old: 'Current mark: off-centre half-dome, sits low in its box',
        c1: '1. Stud block: one flat-topped stud, centred on a 24 by 14 brick (ships)',
        c2: '2. Two-stud brick: a classic 2-wide brick, lower and wider',
        c3: '3. Lifted stud: a compact brick with the stud separated by a clear gap',
      };
      const list = document.getElementById('list');
      for (const id of ['old', 'c1', 'c2', 'c3']) {
        const shape = shapes[id];
        const h = document.createElement('h2');
        h.textContent = names[id];
        const row = document.createElement('div');
        row.className = 'row';
        for (const tone of ['light', 'dark']) {
          const panel = document.createElement('div');
          panel.className = 'panel ' + tone;
          for (const size of [16, 32, 128]) {
            panel.insertAdjacentHTML('beforeend',
              `<svg width="${size}" height="${size}" viewBox="0 0 32 32" role="img" aria-label="${id === 'old' ? 'Current mark' : 'Candidate ' + id.slice(1)} at ${size} px on ${tone}">${shape}</svg>`);
          }
          row.append(panel);
        }
        list.append(h, row);
      }
    </script>
  </body>
</html>
