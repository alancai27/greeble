<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>World demo</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font: 14px/1.3 system-ui, sans-serif; }
    body { background: linear-gradient(#bfe3ff, #eef7ff); }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .panel {
      position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 520px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center;
      padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,.85); color: #1b1f27;
      box-shadow: 0 4px 18px rgba(0,0,0,.15);
    }
    .panel input { grid-column: 1 / -1; width: 100%; }
    .stats { font-variant-numeric: tabular-nums; color: #4a5160; }
    .row { display: flex; gap: 12px; align-items: center; }
    select { font: inherit; padding: 2px 4px; }
  </style>
</head>
<body>
  <div class="panel">
    <span class="row">
      <select id="theme" aria-label="Theme">
        <option value="meadow">Meadow</option>
        <option value="desert">Desert</option>
        <option value="neon">Neon</option>
        <option value="snow">Snow</option>
      </select>
      <label for="p">Progress <span id="pv">0.00</span></label>
    </span>
    <span class="stats" id="stats"></span>
    <input id="p" type="range" min="0" max="1" step="0.001" value="0" />
  </div>
  <script type="module" src="/src/three/world1-demo.ts"></script>
</body>
</html>
